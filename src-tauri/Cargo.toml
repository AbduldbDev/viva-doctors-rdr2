[package]
name = "viva-doctors"
version = "1.0.0"
description = "Ulat ng Kaso — VIVA! Doctors"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = ["clipboard-all"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
